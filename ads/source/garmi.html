<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<script src="/home/claude/libs/node_modules/gsap/dist/gsap.min.js"></script>
<script src="common.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:540px;height:960px;overflow:hidden;font-family:'DM Sans',sans-serif}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:#0B7FC4}
.disp{font-family:'Unbounded';font-weight:900;letter-spacing:-.02em;line-height:.92}
.urdu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;line-height:2.2}
/* scene 1: heat */
#hot{position:absolute;inset:0;background:linear-gradient(180deg,#FFC24B 0%,#FF7A3D 55%,#E2453A 100%);z-index:5}
#hotInner{position:absolute;inset:0;filter:url(#haze)}
#sun{position:absolute;left:50%;top:120px;width:520px;height:520px;margin-left:-260px;border-radius:50%;background:radial-gradient(circle,#FFF4C2 0%,#FFD25E 30%,rgba(255,178,30,.0) 68%)}
#deg{position:absolute;left:0;right:0;top:290px;text-align:center;color:#fff;font-size:200px;text-shadow:0 10px 60px rgba(160,30,0,.35)}
#deg sup{font-size:.45em;vertical-align:top;position:relative;top:.25em}
#where{position:absolute;left:0;right:0;top:520px;text-align:center;color:#FFF1DE;font-weight:700;letter-spacing:.3em;font-size:18px}
#hotU{position:absolute;left:0;right:0;top:570px;text-align:center;color:#fff;font-size:40px}
#dunes{position:absolute;left:0;right:0;bottom:0;height:220px}
/* scene 2: cool */
#cool{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 40%,#3FD0FF 0%,#0EA0E0 40%,#0A5F9E 100%)}
#rays{position:absolute;left:50%;top:-200px;width:900px;height:900px;margin-left:-450px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0 8deg,transparent 8deg 20deg);border-radius:50%;animation:rot 30s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#bWrap{position:absolute;left:50%;top:262px;width:290px;height:600px;margin-left:-145px;filter:drop-shadow(0 40px 40px rgba(0,40,80,.45))}
.ice{position:absolute;width:70px;height:70px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(200,240,255,.55) 45%,rgba(160,220,255,.35));box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),0 10px 30px rgba(0,60,120,.25)}
.ice::after{content:"";position:absolute;left:10px;top:8px;width:22px;height:8px;border-radius:6px;background:#fff;opacity:.9}
#cap2{position:absolute;left:0;right:0;top:70px;text-align:center;color:#fff;font-size:46px}
#cap2 small{display:block;font-family:'DM Sans';font-weight:700;font-size:18px;letter-spacing:.24em;margin-top:14px;color:#D6F4FF}
.cond{position:absolute;width:8px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:rgba(255,255,255,.85);opacity:0}
/* scene 3: kinetic */
#kin{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;justify-content:center;padding:0 40px;background:#FF6B4A}
#kin .w{font-family:'Unbounded';font-weight:900;letter-spacing:-.02em;line-height:1.02;font-size:80px;color:#fff;display:block}
#kin .w.ink{color:#0A1A33}
#kin .urdu{font-size:38px;color:#FFE7B8;margin-top:20px;align-self:flex-start}
/* end */
#end{position:absolute;inset:0;opacity:0;background:radial-gradient(90% 60% at 50% 45%,#13335E,#0A1A33 70%);display:flex;flex-direction:column;align-items:center;justify-content:center}
#end .logo{font-size:58px;color:#fff;display:flex;gap:14px;align-items:center}
#end .ed{color:#FF8A6B;font-weight:700;letter-spacing:.42em;font-size:18px;margin-top:12px}
#eb{width:170px;height:350px;margin:40px 0;transform:rotate(-8deg)}
.pill{background:#1FAF5A;color:#fff;font-weight:700;font-size:24px;padding:20px 34px;border-radius:999px;box-shadow:0 10px 40px rgba(31,175,90,.5)}
.small{color:#A9BCD6;font-weight:700;font-size:17px;letter-spacing:.08em;margin-top:20px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="haze"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.008 0.03" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="12"/></filter></svg>
<div id="stage">
  <div id="cool"><div id="rays"></div>
    <div id="cap2" class="disp">2 litres.<br>Ice-ready.<small>WIDE MOUTH · LEAK-PROOF</small></div>
    <div id="bWrap"></div>
    <div id="ices"></div>
    <div id="conds"></div>
  </div>
  <div id="hot"><div id="hotInner">
    <div id="sun"></div>
    <svg id="dunes" viewBox="0 0 540 220" preserveAspectRatio="none"><path d="M0 120 Q140 60 270 110 T540 90 V220 H0Z" fill="#E8603A"/><path d="M0 170 Q160 120 330 160 T540 150 V220 H0Z" fill="#C9432E"/></svg>
  </div>
    <div id="deg" class="disp"><span id="dn">30</span><sup>°C</sup></div>
    <div id="where">MULTAN · JUNE · 2 PM</div>
    <div id="hotU" class="urdu">پیاس لگی؟</div>
  </div>
  <div id="kin">
    <span class="w">Garmi</span><span class="w">ho ya</span><span class="w ink">dhoop,</span><span class="w">paani</span><span class="w ink">time pe.</span>
    <div class="urdu">گرمی ہو یا دھوپ، پانی ٹائم پہ</div>
  </div>
  <div id="end">
    <div class="disp logo"><svg width="54" height="54" viewBox="0 0 26 26"><path d="M13 2C13 2 4 12 4 17a9 9 0 0 0 18 0C22 12 13 2 13 2Z" fill="#22B8E8"/></svg>GHOONT</div>
    <div class="ed">GARMI · 2 LITRES</div>
    <div id="eb"></div>
    <div class="pill">Order on WhatsApp</div>
    <div class="small">Cash on delivery · All Pakistan</div>
  </div>
  <canvas id="fx"></canvas><div id="grain"></div>
</div>
<script>
FX.init(540,960);GRAIN.init();
const bW=document.getElementById('bWrap');
bW.innerHTML=bottle({colour:'#FF6B4A',liquid:'#7FE0FF',labels:true,level:.3,body:.35});
document.getElementById('eb').innerHTML=bottle({colour:'#FF6B4A',liquid:'#7FE0FF',labels:false,level:.85,body:.3});
// ice cubes start above the bottle mouth
const ices=document.getElementById('ices');
for(let i=0;i<4;i++){ices.insertAdjacentHTML('beforeend',`<div class="ice" id="ice${i}" style="left:${235+(i%2?18:-14)}px;top:-90px"></div>`)}
// condensation dots on bottle body
const conds=document.getElementById('conds');
for(let i=0;i<26;i++){const x=125+38+rnd()*210,y=262+115+rnd()*430,s=.6+rnd()*.9;conds.insertAdjacentHTML('beforeend',`<i class="cond" style="left:${x}px;top:${y}px;transform:scale(${s})"></i>`)}
const tl=gsap.timeline({paused:true});
const deg={v:30};
tl.from('#sun',{scale:.4,opacity:0,duration:1.2,ease:'power2.out'},0)
  .from('#deg',{scale:1.6,opacity:0,duration:.5,ease:'back.out(2)'},.2)
  .to(deg,{v:47,duration:1.8,ease:'power2.out',onUpdate(){document.getElementById('dn').textContent=Math.round(deg.v)}},.4)
  .from('#where',{opacity:0,y:20,duration:.5},.8)
  .from('#hotU',{opacity:0,y:20,duration:.5},1.3)
  .to('#sun',{scale:1.15,duration:1.2,yoyo:true,repeat:1,ease:'sine.inOut'},1.2)
  .to('#turb',{attr:{baseFrequency:'0.012 0.05'},duration:3,ease:'none'},0)
// cool wipe (diagonal water wave)
  .fromTo('#hot',{clipPath:'polygon(0 0,100% 0,100% 100%,0 100%)'},{clipPath:'polygon(0 0,100% 0,100% 0%,0 0%)',duration:.7,ease:'power3.inOut'},3.1)
  .fromTo('#bWrap',{y:-900,rotation:-15},{y:0,rotation:0,duration:.9,ease:'bounce.out'},3.4)
  .from('#cap2',{opacity:0,y:-30,duration:.5},3.8);
// ice drops: each lands in the mouth and raises the level
const lvl={v:.3};
for(let i=0;i<4;i++){
  const t=4.4+i*.62;
  tl.fromTo('#ice'+i,{y:0,rotation:-30+i*25,opacity:1},{y:345,rotation:40-i*15,duration:.5,ease:'power2.in'},t)
    .to('#ice'+i,{opacity:0,scale:.6,duration:.1},t+.5)
    .to(lvl,{v:.3+.175*(i+1),duration:.4,ease:'power2.out',onUpdate(){setLevel(bW,lvl.v)}},t+.42)
    .to('#bWrap',{keyframes:[{y:10,duration:.08},{y:0,duration:.3,ease:'elastic.out(1,.4)'}]},t+.42);
  FX.burst(t+.5,270,265,16,{speed:[300,650],spread:1.8,colours:['#7FE0FF','#ffffff','#BDEFFF'],size:[3,9]});
}
tl.to('.cond',{opacity:1,stagger:{each:.05,from:'random'},duration:.4},6.0)
  .to('.cond',{y:'+=40',stagger:{each:.03,from:'random'},duration:1.6,ease:'power1.in'},6.6)
  .to('#bWrap',{scale:1.05,duration:.6,yoyo:true,repeat:1,ease:'sine.inOut'},7.0)
// kinetic text
  .to('#kin',{opacity:1,duration:.01},8.2)
  .fromTo('#kin',{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)',duration:.6,ease:'power3.inOut'},8.2)
  .from('#kin .w',{xPercent:-120,opacity:0,stagger:.22,duration:.45,ease:'power4.out'},8.5)
  .from('#kin .urdu',{opacity:0,y:20,duration:.5},9.8)
  .to('#kin .w',{x:8,yoyo:true,repeat:1,duration:.06,stagger:.03},10.4)
// end
  .to('#end',{opacity:1,duration:.5},11.4)
  .from('#end .logo',{scale:.6,opacity:0,duration:.6,ease:'back.out(2)'},11.5)
  .from('#end .ed',{opacity:0,letterSpacing:'1em',duration:.8,ease:'power3.out'},11.7)
  .from('#eb',{y:400,rotation:20,duration:.9,ease:'back.out(1.4)'},11.8)
  .from('.pill',{scale:.4,opacity:0,duration:.5,ease:'back.out(2.4)'},12.6)
  .from('.small',{opacity:0,duration:.4},12.9)
  .to('.pill',{scale:1.06,yoyo:true,repeat:3,duration:.28},13.3)
  .to({}, {duration:.01},15);
FX.burst(3.15,270,960,34,{speed:[700,1200],spread:1.4,colours:['#7FE0FF','#ffffff'],size:[4,12]});
FX.burst(12.6,270,760,22,{speed:[300,700],spread:2.4,colours:['#7FE0FF','#FF8A6B','#ffffff']});
wireSeek(tl);
</script></body></html>
