<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<script src="/home/claude/libs/node_modules/gsap/dist/gsap.min.js"></script>
<script src="common.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:540px;height:960px;overflow:hidden;font-family:'DM Sans',sans-serif}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:radial-gradient(120% 80% at 50% 35%,#33268A 0%,#16124A 45%,#070A22 100%)}
.disp{font-family:'Unbounded';font-weight:900;letter-spacing:-.02em;line-height:.95}
.urdu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;line-height:2.2}
.gold{color:#FFD37A}
#stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
#moon{position:absolute;right:56px;top:120px;width:120px;height:120px}
#glow{position:absolute;right:-40px;top:20px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,211,122,.35),transparent 65%)}
.lantern{position:absolute;top:-10px;width:56px;transform-origin:50% 0}
#skyline{position:absolute;left:0;right:0;bottom:0;height:200px}
#t1{position:absolute;left:44px;right:44px;top:340px;color:#fff;font-size:62px}
#t1 .l{display:block;overflow:hidden}
#t1 .l span{display:inline-block}
#t1u{position:absolute;left:44px;top:610px;font-size:34px;color:#FFD37A}
#bWrap{position:absolute;left:50%;top:170px;width:290px;height:600px;margin-left:-145px;filter:drop-shadow(0 0 50px rgba(160,140,255,.55))}
#halo{position:absolute;left:50%;top:300px;width:520px;height:520px;margin-left:-260px;border-radius:50%;background:radial-gradient(circle,rgba(139,124,255,.45),transparent 62%);opacity:0}
#now{position:absolute;left:0;right:0;top:66px;text-align:center;color:#FFD37A;font-size:56px;opacity:0}
#nowSub{position:absolute;left:0;right:0;top:136px;text-align:center;color:#C9C3FF;font-weight:700;letter-spacing:.2em;font-size:15px;opacity:0}
#t2{position:absolute;left:0;right:0;top:560px;text-align:center;opacity:0}
#t2 .urdu{font-size:54px;color:#FFD37A}
#t2 .en{color:#fff;font-weight:700;font-size:22px;margin-top:-4px}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#end .logo{font-size:58px;color:#fff;display:flex;gap:14px;align-items:center}
#end .ed{color:#FFD37A;font-weight:700;letter-spacing:.42em;font-size:18px;margin-top:12px}
#trio{display:flex;gap:22px;height:300px;margin:44px 0 44px}
#trio div{width:120px;height:300px}
.pill{background:linear-gradient(180deg,#FFE29A,#F2B84B);color:#1A1240;font-weight:700;font-size:24px;padding:20px 34px;border-radius:999px;box-shadow:0 10px 40px rgba(255,211,122,.45)}
.small{color:#C9C3FF;font-weight:700;font-size:17px;letter-spacing:.08em;margin-top:20px}
</style></head><body>
<div id="stage">
  <div id="stars"></div>
  <div id="glow"></div>
  <svg id="moon" viewBox="0 0 120 120"><defs><mask id="cm"><rect width="120" height="120" fill="#fff"/><circle cx="78" cy="46" r="48" fill="#000"/></mask></defs><circle cx="60" cy="60" r="52" fill="#FFE6A3" mask="url(#cm)"/></svg>
  <div id="lanterns"></div>
  <svg id="skyline" viewBox="0 0 540 200" preserveAspectRatio="none"><path fill="#0B0A2A" d="M0 200V150h40v-30h10v30h30v-20q30-50 60 0v20h20V90l6-14 6 14v110h0V150h40q10-60 70-60t70 60h40V90l6-14 6 14v60h30v-25q25-40 50 0v25h40v-40h10v40h40v50z"/></svg>
  <div id="t1" class="disp"><span class="l"><span>Long roza.</span></span><span class="l"><span class="gold">Short night.</span></span></div>
  <div id="t1u" class="urdu">لمبا روزہ، چھوٹی رات</div>
  <div id="halo"></div>
  <div id="now" class="disp">Iftar</div>
  <div id="nowSub">DRINK TO THE LINE</div>
  <div id="bWrap"></div>
  <div id="t2"><div class="urdu">افطار سے سحری تک</div><div class="en">From Iftar to Sehri, one line at a time.</div></div>
  <div id="end">
    <div class="disp logo"><svg width="54" height="54" viewBox="0 0 26 26"><path d="M13 2C13 2 4 12 4 17a9 9 0 0 0 18 0C22 12 13 2 13 2Z" fill="#B9AEFF"/></svg>GHOONT</div>
    <div class="ed">ROZA EDITION</div>
    <div id="trio"><div id="r1"></div><div id="r2"></div><div id="r3"></div></div>
    <div class="pill">Pre-order on WhatsApp</div>
    <div class="small">Ready before Ramadan · Cash on delivery</div>
  </div>
  <canvas id="fx"></canvas><div id="grain"></div>
</div>
<script>
FX.init(540,960);GRAIN.init();
const S=document.getElementById('stars');
for(let i=0;i<110;i++){const e=document.createElement('i');const s=1+rnd()*2.5;e.style.cssText=`left:${rnd()*100}%;top:${rnd()*72}%;width:${s}px;height:${s}px;animation-delay:${-rnd()*3}s;animation-duration:${1.8+rnd()*2.4}s`;S.appendChild(e)}
const L=document.getElementById('lanterns');
[[22,250],[92,160],[478,330]].forEach(([x,len],i)=>{L.insertAdjacentHTML('beforeend',`<svg class="lantern" id="ln${i}" style="left:${x}px;height:${len+90}px" viewBox="0 0 56 ${len+90}"><line x1="28" y1="0" x2="28" y2="${len}" stroke="#FFD37A" stroke-width="1.5" opacity=".7"/><g transform="translate(0,${len})"><path d="M16 6h24l-4-6H20z" fill="#E8B84A"/><rect x="12" y="6" width="32" height="50" rx="10" fill="#FFB547"/><rect x="18" y="12" width="20" height="38" rx="7" fill="#FFF1C2"/><path d="M14 56h28l-6 10H20z" fill="#E8B84A"/><circle cx="28" cy="31" r="40" fill="url(#lg)" opacity=".5"/></g><defs><radialGradient id="lg"><stop offset="0" stop-color="#FFD37A" stop-opacity=".9"/><stop offset="1" stop-color="#FFD37A" stop-opacity="0"/></radialGradient></defs></svg>`)});
const bW=document.getElementById('bWrap');
bW.innerHTML=bottle({colour:'#8B7CFF',liquid:'#B9AEFF',mode:'roza',ink:'#ffffff',body:.12,level:1});
document.getElementById('r1').innerHTML=bottle({colour:'#8B7CFF',liquid:'#B9AEFF',labels:false,level:.75,body:.12});
document.getElementById('r2').innerHTML=bottle({colour:'#E8B84A',liquid:'#FFD37A',labels:false,level:.75,body:.12});
document.getElementById('r3').innerHTML=bottle({colour:'#19B3A6',liquid:'#5FD8CC',labels:false,level:.75,body:.12});
const mks=[...bW.querySelectorAll('.mk')];
const NAMES=['Iftar','Maghrib','Isha','Taraweeh','Midnight','Sehri'];
const st={p:0};let lastI=-1;
const tl=gsap.timeline({paused:true});
tl.fromTo('#moon',{y:300,opacity:0},{y:0,opacity:1,duration:2.2,ease:'power2.out'},0)
  .fromTo('#glow',{opacity:0,scale:.5},{opacity:1,scale:1,duration:2.4,ease:'power2.out'},0)
  .from('.lantern',{y:-260,stagger:.15,duration:1.3,ease:'bounce.out'},0.1)
  .from('#t1 .l span',{yPercent:110,stagger:.4,duration:.7,ease:'power4.out'},.6)
  .from('#t1u',{opacity:0,y:20,duration:.6},1.6)
  .to('#t1,#t1u',{opacity:0,y:-50,duration:.5,ease:'power2.in'},3.1)
  .fromTo('#bWrap',{y:900},{y:0,duration:1.0,ease:'power3.out'},3.3)
  .to('#halo',{opacity:1,duration:1},3.6)
  .to('#now,#nowSub',{opacity:1,duration:.4},4.0)
  .to(st,{p:1,duration:4.4,ease:'none',onUpdate(){
      const p=st.p;setLevel(bW,1-p);const i=Math.min(5,Math.floor(p*5+.02));
      mks.forEach((m,k)=>{const on=k<=i;m.querySelector('line').setAttribute('stroke',on?'#FFD37A':'#ffffff');m.querySelector('text').setAttribute('fill',on?'#FFD37A':'#ffffff')});
      document.getElementById('now').textContent=NAMES[i];
    }},4.3)
  .to('#bWrap',{keyframes:[{rotation:-12,duration:.15},{rotation:0,duration:.55,ease:'elastic.out(1,.4)'}],repeat:4,repeatDelay:.18,transformOrigin:'50% 40%'},4.9)
  .to('#now,#nowSub',{opacity:0,duration:.3},8.9)
  .to('#bWrap',{scale:.62,y:-150,duration:.8,ease:'power3.inOut'},8.9)
  .to('#halo',{y:-150,scale:.7,duration:.8,ease:'power3.inOut'},8.9)
  .to('#t2',{opacity:1,duration:.01},9.5)
  .from('#t2 .urdu',{opacity:0,y:40,scale:.9,duration:.7,ease:'back.out(1.8)'},9.5)
  .from('#t2 .en',{opacity:0,y:20,duration:.5},10.0)
  .to('#bWrap,#halo,#t2,#lanterns',{opacity:0,duration:.5},11.6)
  .to('#moon,#glow',{opacity:.18,duration:.5},11.6)
  .to('#end',{opacity:1,duration:.5},11.8)
  .from('#end .logo',{scale:.6,opacity:0,duration:.6,ease:'back.out(2)'},11.9)
  .from('#end .ed',{opacity:0,letterSpacing:'1em',duration:.8,ease:'power3.out'},12.1)
  .from('#trio > div',{y:260,opacity:0,stagger:.12,duration:.8,ease:'back.out(1.5)'},12.2)
  .from('.pill',{scale:.4,opacity:0,duration:.5,ease:'back.out(2.4)'},12.9)
  .from('.small',{opacity:0,duration:.4},13.2)
  .to('.pill',{scale:1.06,yoyo:true,repeat:3,duration:.28},13.6)
  .to({}, {duration:.01},15);
// gentle lantern swing over whole ad
[0,1,2].forEach(i=>tl.fromTo('#ln'+i,{rotation:-6+i*3},{rotation:6-i*3,duration:1.6+i*.3,ease:'sine.inOut',yoyo:true,repeat:9},0));
for(let k=0;k<5;k++) FX.burst(4.95+k*0.88,262,190,12,{speed:[260,520],spread:.9,up:-Math.PI*.58,colours:['#FFD37A','#B9AEFF','#ffffff'],size:[3,8]});
FX.burst(9.5,270,600,30,{speed:[200,520],spread:6.2,colours:['#FFD37A','#ffffff'],g:300,life:1.8,size:[2,6]});
FX.burst(12.9,270,780,26,{speed:[300,650],spread:2.6,colours:['#FFD37A','#B9AEFF'],size:[3,8]});
wireSeek(tl);
</script></body></html>
