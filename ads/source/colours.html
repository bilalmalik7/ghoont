<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<script src="/home/claude/libs/node_modules/gsap/dist/gsap.min.js"></script>
<script src="common.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:540px;height:675px;overflow:hidden;font-family:'DM Sans',sans-serif}
#stage{position:relative;width:540px;height:675px;overflow:hidden;background:#DFF5FD}
.disp{font-family:'Unbounded';font-weight:900;letter-spacing:-.02em;line-height:.92}
.bg{position:absolute;inset:0;clip-path:circle(0% at 50% 55%)}
.word{position:absolute;left:0;top:250px;white-space:nowrap;font-family:'Unbounded';font-weight:900;font-size:190px;color:transparent;-webkit-text-stroke:2px rgba(10,26,51,.18);letter-spacing:-.02em}
.bot{position:absolute;left:50%;top:150px;width:200px;height:440px;margin-left:-100px;filter:drop-shadow(0 30px 30px rgba(10,26,51,.25))}
#shadow{position:absolute;left:50%;top:590px;width:200px;height:26px;margin-left:-100px;border-radius:50%;background:radial-gradient(closest-side,rgba(10,26,51,.25),transparent)}
#head{position:absolute;left:34px;top:34px;color:#0A1A33;font-size:34px;z-index:20}
#name{position:absolute;right:34px;top:40px;font-weight:700;letter-spacing:.24em;font-size:15px;color:#0A1A33;z-index:20;text-align:right}
#name b{display:block;font-family:'Unbounded';font-size:28px;letter-spacing:0;margin-top:4px}
#foot{position:absolute;left:34px;bottom:30px;right:34px;display:flex;justify-content:space-between;align-items:center;z-index:20;font-weight:700;color:#0A1A33;font-size:16px}
#end{position:absolute;inset:0;opacity:0;background:#0A1A33;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}
#end .logo{font-size:46px;color:#fff;display:flex;gap:12px;align-items:center}
#end .tag{color:#7FE0FF;font-weight:700;font-size:20px;margin-top:10px}
#four{display:flex;gap:16px;height:250px;margin:34px 0}
#four div{width:100px;height:250px}
.pill{background:#1FAF5A;color:#fff;font-weight:700;font-size:21px;padding:16px 28px;border-radius:999px}
.small{color:#A9BCD6;font-weight:700;font-size:15px;letter-spacing:.08em;margin-top:16px}
</style></head><body>
<div id="stage">
  <div id="layers"></div>
  <div id="shadow"></div>
  <div id="bots"></div>
  <div id="head" class="disp">Pick your<br>colour.</div>
  <div id="name">COLOUR<b id="nm" style="color:#22B8E8">Aqua</b></div>
  <div id="foot"><span>GHOONT · The bottle that tells time</span><span>1 / 4</span></div>
  <div id="end">
    <div class="disp logo"><svg width="44" height="44" viewBox="0 0 26 26"><path d="M13 2C13 2 4 12 4 17a9 9 0 0 0 18 0C22 12 13 2 13 2Z" fill="#22B8E8"/></svg>GHOONT</div>
    <div class="tag">Four colours. One habit.</div>
    <div id="four"></div>
    <div class="pill">Order on WhatsApp</div>
    <div class="small">Cash on delivery · All Pakistan</div>
  </div>
  <canvas id="fx"></canvas><div id="grain"></div>
</div>
<script>
FX.init(540,675);GRAIN.init();
const C=[["Aqua","#22B8E8","#DFF5FD"],["Mango","#FFB21E","#FFF1D0"],["Rose","#FF7FA8","#FFE3EC"],["Mint","#2FCB8E","#DDF7EA"]];
const layers=document.getElementById('layers'),bots=document.getElementById('bots'),four=document.getElementById('four');
C.forEach(([n,c,bg],i)=>{
  layers.insertAdjacentHTML('beforeend',`<div class="bg" id="bg${i}" style="background:${bg};${i===0?'clip-path:circle(150% at 50% 55%)':''}"><div class="word" id="wd${i}">${(n.toUpperCase()+' ').repeat(4)}</div></div>`);
  bots.insertAdjacentHTML('beforeend',`<div class="bot" id="bt${i}" style="opacity:${i===0?1:0}">${bottle({colour:c,level:.72,body:.35})}</div>`);
  four.insertAdjacentHTML('beforeend',`<div id="f${i}">${bottle({colour:c,labels:false,level:.72,body:.3})}</div>`);
});
const tl=gsap.timeline({paused:true});
const nm=document.getElementById('nm'),cnt=document.querySelector('#foot span:last-child');
tl.from('#bt0',{y:-500,rotation:-20,duration:.9,ease:'bounce.out'},0)
  .from('#head',{opacity:0,x:-30,duration:.6},.3)
  .from('#name,#foot',{opacity:0,duration:.5},.5);
// marquee words drift across the whole ad
C.forEach((_,i)=>tl.fromTo('#wd'+i,{x:0},{x:-700,duration:10,ease:'none'},0));
for(let i=1;i<4;i++){
  const t=1.6+i*2.0;
  tl.to('#bg'+i,{clipPath:'circle(150% at 50% 55%)',duration:.8,ease:'power3.inOut'},t)
    .to('#bt'+(i-1),{y:-40,rotation:-25,opacity:0,duration:.35,ease:'power2.in'},t)
    .fromTo('#bt'+i,{y:120,rotation:20,opacity:0},{y:0,rotation:0,opacity:1,duration:.7,ease:'back.out(1.8)'},t+.25)
    .add(()=>{},t)
    .call(()=>{},null,t);
  FX.burst(t+.3,270,150,20,{speed:[300,650],spread:2.6,colours:[C[i][1],'#ffffff'],size:[4,10]});
}
// text swaps driven by a tracker so seeking works
const tracker={v:0};
tl.to(tracker,{v:3,duration:6,ease:'steps(3)',onUpdate(){const k=Math.round(tracker.v);nm.textContent=C[k][0];nm.style.color=C[k][1];cnt.textContent=`${k+1} / 4`}},1.9);
tl.to('.bot',{rotation:4,yoyo:true,repeat:1,duration:.4,ease:'sine.inOut'},9.2)
  .to('#end',{opacity:1,duration:.5},9.8)
  .from('#end .logo',{scale:.6,opacity:0,duration:.5,ease:'back.out(2)'},9.9)
  .from('#end .tag',{opacity:0,y:14,duration:.4},10.1)
  .from('#four > div',{y:250,opacity:0,stagger:.1,duration:.7,ease:'back.out(1.6)'},10.1)
  .from('.pill',{scale:.4,opacity:0,duration:.45,ease:'back.out(2.4)'},10.7)
  .from('.small',{opacity:0,duration:.4},10.9)
  .to({}, {duration:.01},12);
wireSeek(tl);
</script></body></html>
